openapi: 3.1.2
info:
  title: Day in School Campus Cloud API
  version: 1.0.0
  summary: Contract-First REST API for Day in School Campus Cloud, XPEACH SSO BFF, Triple-Schedule Reservation Engine, Parcel Hub & Plugin Ecosystem
  description: |
    Authoritative OpenAPI 3.1.2 specification for `cloud-in-school` (`day-in-school-cloud`).
    Enforces ADR-001 through ADR-007 and `SYSTEM_CONTRACT.md`:
    - XPEACH SSO zero-source-modification OIDC BFF + App Link single-use ticket exchange
    - Arbitrary school-permitted target time `T` with 3 durable events (`T-30m` PRECHECK, `T-5m` FINAL_CHECK, `T` FIRE)
    - Strict school capability & kill-switch gating (`MOCK_ONLY` / `MANUAL_ONLY` unless written school authorization is active)
    - Isolated Finance Bridge single-debit path with idempotency key `dis:reservation:<orderUUID>:debit:v1`
    - Parcel Hub 4-source + carrier + campus station aggregation with `PROVIDER_AUTHORITY_MATRIX`
    - Unified `dis-extension/v2` (`dis-plugin/v2`) & `dis-campus-plugin/v1` plugin registry and command broker
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://campus.yellowpeachxgp.com
    description: Domestic Campus Cloud Production Gateway (CN)
  - url: http://127.0.0.1:4100
    description: Local Development & Contract Verification Server
tags:
  - name: system
    description: Health, readiness, and live OpenAPI contract discovery
  - name: auth
    description: Confidential Web OIDC BFF, PKCE mobile ticket exchange, and Cloud session rotation
  - name: me
    description: User profile, devices, 🍑 wallet snapshot, orders, consents, and GDPR/PIPL data rights
  - name: schools
    description: School directory, library capabilities, and versioned booking window rules
  - name: school-bindings
    description: Verified campus identity bindings and KMS-encrypted credential vault lifecycle
  - name: reservations
    description: Arbitrary target T (T-30m / T-5m / T) reservation plans, jobs, cancellation, and authoritative evidence
  - name: pricing
    description: Immutable service pricing catalog
  - name: notifications
    description: User notification inbox and read receipts
  - name: parcels
    description: Parcel Hub multi-source aggregation, trace, pickup codes, stations, sync jobs, and opt-in AI assistant
  - name: plugins
    description: Signed plugin registry (`dis-campus-plugin/v1` & `dis-extension/v2`) and sandboxed command broker
  - name: admin
    description: RBAC operations console, school kill-switch, dual-person approval, finance reconciliation, and security audit
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: getReadyz
      tags: [system]
      summary: Readiness probe checking DB, Queue, and KMS status
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/openapi.json:
    get:
      operationId: getOpenApiSpec
      tags: [system]
      summary: Return the active OpenAPI 3.1.2 contract
      responses:
        '200':
          description: OpenAPI 3.1.2 JSON document
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/mobile/start:
    post:
      operationId: startMobileAuthTransaction
      tags: [auth]
      summary: Initiate mobile OIDC BFF login transaction with client PKCE S256 challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAuthStartRequest'
      responses:
        '201':
          description: Login transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAuthStartEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/oidc/start:
    get:
      operationId: startOidcRedirect
      tags: [auth]
      summary: Redirect system browser / Custom Tab to XPEACH SSO authorization endpoint
      parameters:
        - name: txn
          in: query
          required: true
          schema:
            type: string
            minLength: 16
      responses:
        '302':
          description: Redirect to discovered XPEACH SSO authorization_endpoint
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/oidc/callback:
    get:
      operationId: handleOidcCallback
      tags: [auth]
      summary: Confidential Web Client callback from XPEACH SSO; issues single-use App Link ticket
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to verified Android App Link with single-use app_ticket
          headers:
            Location:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/mobile/exchange:
    post:
      operationId: exchangeMobileAppTicket
      tags: [auth]
      summary: Atomically consume single-use app_ticket and verify mobile PKCE code_verifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTicketExchangeRequest'
      responses:
        '200':
          description: Cloud session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      operationId: refreshCloudSession
      tags: [auth]
      summary: Rotate Cloud refresh token within device session family (replay revokes family)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated Cloud session tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      operationId: logoutCurrentSession
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Revoke current device session
      responses:
        '200':
          description: Current session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAllSessions
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Revoke all device sessions and optionally unlink XPEACH identity
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                unlink_xpeach:
                  type: boolean
                  default: false
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me:
    get:
      operationId: getMyProfile
      tags: [me]
      security:
        - bearerAuth: []
      summary: Get current Cloud user identity summary (minimized SSO subject metadata)
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/devices:
    get:
      operationId: listMyDevices
      tags: [me]
      security:
        - bearerAuth: []
      summary: List active device session families for current user
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/devices/{deviceId}:
    delete:
      operationId: revokeMyDevice
      tags: [me]
      security:
        - bearerAuth: []
      summary: Revoke a specific device session family
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/wallet:
    get:
      operationId: getMyWallet
      tags: [me]
      security:
        - bearerAuth: []
      summary: Read authoritative 🍑 wallet snapshot from XPEACH SSO via Finance Bridge (no hold/freeze claimed)
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Wallet snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletSnapshotEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/orders:
    get:
      operationId: listMyOrders
      tags: [me]
      security:
        - bearerAuth: []
      summary: Cursor-paginated list of user reservation service orders and payment states
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: User orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/consents:
    get:
      operationId: listMyConsents
      tags: [me]
      security:
        - bearerAuth: []
      summary: List explicit user consent records
      responses:
        '200':
          description: Consent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: grantConsent
      tags: [me]
      security:
        - bearerAuth: []
      summary: Record explicit user consent for a specific purpose and policy version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantConsentRequest'
      responses:
        '201':
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/consents/{consentId}:
    delete:
      operationId: withdrawConsent
      tags: [me]
      security:
        - bearerAuth: []
      summary: Withdraw consent and immediately halt dependent scheduled jobs and vault credentials
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Consent withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/data-export:
    post:
      operationId: requestMyDataExport
      tags: [me]
      security:
        - bearerAuth: []
      summary: Export user Cloud data bundle (excluding raw school credentials)
      responses:
        '200':
          description: Export bundle generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/data-delete:
    post:
      operationId: requestMyDataDelete
      tags: [me]
      security:
        - bearerAuth: []
      summary: Destroy school bindings, vault secrets, and active plans while retaining statutory financial ledger refs
      responses:
        '200':
          description: Deletion completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/schools:
    get:
      operationId: listSchools
      tags: [schools]
      summary: List supported schools and their current automation & kill-switch states
      responses:
        '200':
          description: School directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolListEnvelope'
  /api/v1/schools/{schoolId}/library/capabilities:
    get:
      operationId: getSchoolLibraryCapabilities
      tags: [schools]
      summary: Get capability claims and evidence levels for a school's library provider
      parameters:
        - $ref: '#/components/parameters/SchoolIdParam'
      responses:
        '200':
          description: School capability claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolCapabilitiesEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/schools/{schoolId}/library/rules:
    get:
      operationId: getSchoolLibraryRules
      tags: [schools]
      summary: Get versioned daily booking window and lead-time rules for a school
      parameters:
        - $ref: '#/components/parameters/SchoolIdParam'
      responses:
        '200':
          description: School booking rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolBookingRulesEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/schools/{schoolId}/booking-rules:
    get:
      operationId: getSchoolBookingRulesCanonical
      tags: [schools]
      summary: Canonical ADR-005 endpoint for versioned school booking window and T-30m / T-5m / T rules
      parameters:
        - $ref: '#/components/parameters/SchoolIdParam'
      responses:
        '200':
          description: School booking rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolBookingRulesEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/school-bindings:
    get:
      operationId: listMySchoolBindings
      tags: [school-bindings]
      security:
        - bearerAuth: []
      summary: List current user's school identity bindings
      responses:
        '200':
          description: User's school bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolBindingListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: initiateSchoolBinding
      tags: [school-bindings]
      security:
        - bearerAuth: []
      summary: Initiate verified school account binding with explicit consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchoolBindingRequest'
      responses:
        '201':
          description: Binding challenge initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolBindingEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/school-bindings/{bindingId}/complete:
    post:
      operationId: completeSchoolBinding
      tags: [school-bindings]
      security:
        - bearerAuth: []
      summary: Complete school identity verification and optionally escrow delegated token into CN Vault
      parameters:
        - $ref: '#/components/parameters/BindingIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSchoolBindingRequest'
      responses:
        '200':
          description: School binding verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolBindingEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/school-bindings/{bindingId}/reauthorize:
    post:
      operationId: reauthorizeSchoolBinding
      tags: [school-bindings]
      security:
        - bearerAuth: []
      summary: Reauthorize an expired or degraded school binding
      parameters:
        - $ref: '#/components/parameters/BindingIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSchoolBindingRequest'
      responses:
        '200':
          description: School binding reauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolBindingEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/school-bindings/{bindingId}:
    delete:
      operationId: revokeSchoolBinding
      tags: [school-bindings]
      security:
        - bearerAuth: []
      summary: Revoke school binding, destroy KMS vault secret, and cancel queued jobs
      parameters:
        - $ref: '#/components/parameters/BindingIdParam'
      responses:
        '200':
          description: Binding revoked and credentials destroyed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reservation-plans:
    get:
      operationId: listReservationPlans
      tags: [reservations]
      security:
        - bearerAuth: []
      summary: List user's Cloud reservation plans
      responses:
        '200':
          description: Reservation plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPlanListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createReservationPlan
      tags: [reservations]
      security:
        - bearerAuth: []
      summary: Create a date-scoped reservation plan with user-customizable target time T (schedules T-30m, T-5m, T)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationPlanRequest'
      responses:
        '201':
          description: Created reservation plan and triple-schedule events (T-30m, T-5m, T)
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPlanEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/reservation-plans/{planId}:
    patch:
      operationId: updateReservationPlan
      tags: [reservations]
      security:
        - bearerAuth: []
      summary: Update target time T or seat preferences on an unexecuted plan (increments generation)
      parameters:
        - $ref: '#/components/parameters/PlanIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReservationPlanRequest'
      responses:
        '200':
          description: Plan updated and triple-schedule events regenerated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPlanEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: cancelReservationPlan
      tags: [reservations]
      security:
        - bearerAuth: []
      summary: Disable plan and cancel unexecuted jobs and schedule events
      parameters:
        - $ref: '#/components/parameters/PlanIdParam'
      responses:
        '200':
          description: Plan cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/reservation-jobs:
    get:
      operationId: listReservationJobs
      tags: [reservations]
      security:
        - bearerAuth: []
      summary: List user's reservation jobs and their T-30m / T-5m / T event statuses
      responses:
        '200':
          description: Reservation job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationJobListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/reservation-jobs/{jobId}:
    get:
      operationId: getReservationJob
      tags: [reservations]
      security:
        - bearerAuth: []
      summary: Get detailed status and triple-schedule events for a reservation job
      parameters:
        - $ref: '#/components/parameters/JobIdParam'
      responses:
        '200':
          description: Reservation job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationJobEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/reservation-jobs/{jobId}/cancel:
    post:
      operationId: cancelReservationJob
      tags: [reservations]
      security:
        - bearerAuth: []
      summary: Cancel an unexecuted reservation job via CAS state_version check
      parameters:
        - $ref: '#/components/parameters/JobIdParam'
      responses:
        '200':
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationJobEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/reservation-jobs/{jobId}/evidence:
    get:
      operationId: getReservationJobEvidence
      tags: [reservations]
      security:
        - bearerAuth: []
      summary: Get sanitized authoritative school readback evidence for a reservation job
      parameters:
        - $ref: '#/components/parameters/JobIdParam'
      responses:
        '200':
          description: Sanitized booking verification evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationEvidenceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/pricing/library-booking:
    get:
      operationId: getLibraryBookingPricing
      tags: [pricing]
      summary: Get current immutable pricing catalog for LOCAL_DEVICE (0 🍑), MANUAL_REMINDER (0 🍑), and CLOUD_HOSTED
      responses:
        '200':
          description: Pricing catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingCatalogEnvelope'
  /api/v1/notifications:
    get:
      operationId: listMyNotifications
      tags: [notifications]
      security:
        - bearerAuth: []
      summary: List user notifications
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      security:
        - bearerAuth: []
      summary: Mark a notification as read (idempotent)
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/parcels:
    get:
      operationId: listParcels
      tags: [parcels]
      security:
        - bearerAuth: []
      summary: Cursor-paginated list of canonical parcels scoped by campus_profile_id
      parameters:
        - name: campus_profile_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Canonical parcel list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/parcels/{parcelId}:
    get:
      operationId: getParcelById
