name: Android Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Semantic Version from Tag or version.properties
        id: meta
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-1}
          PATCH=${PATCH%%-*}
          PATCH=${PATCH:-0}
          VER_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "TAG_NAME=v${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=${VER_CODE}" >> "$GITHUB_OUTPUT"

      - name: Decode Release Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystore/haut-release.jks
          fi

      - name: Run Unit Tests & Assemble Release APK
        env:
          APP_VERSION_NAME: ${{ steps.meta.outputs.VERSION_NAME }}
          APP_VERSION_CODE: ${{ steps.meta.outputs.VERSION_CODE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :core:domain:test :core:academic:testDebugUnitTest :app:assembleRelease :app:assembleDebug --stacktrace
          mkdir -p release-assets
          REL_APK="release-assets/day-in-school-v${{ steps.meta.outputs.VERSION_NAME }}-release.apk"
          DBG_APK="release-assets/day-in-school-v${{ steps.meta.outputs.VERSION_NAME }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$REL_APK"
          cp app/build/outputs/apk/debug/app-debug.apk "$DBG_APK"
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG_NAME }}
          name: "日在校园 (Day in School) ${{ steps.meta.outputs.TAG_NAME }} (Android 16 / API 36)"
          generate_release_notes: true
          files: |
            release-assets/day-in-school-v${{ steps.meta.outputs.VERSION_NAME }}-release.apk
            release-assets/day-in-school-v${{ steps.meta.outputs.VERSION_NAME }}-debug.apk
            release-assets/SHA256SUMS.txt
