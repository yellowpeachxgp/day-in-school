name: Android 正式发行

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '已存在的正式版本标签，例如 v0.11.3'
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    name: 质量门禁、正式签名与发行
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出标签对应源码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 检查正式签名配置
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            test -n "${!name}" || { echo "缺少正式签名配置：$name"; exit 1; }
          done
          mkdir -p keystore
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystore/haut-release.jks
          chmod 600 keystore/haut-release.jks
          keytool -exportcert -keystore keystore/haut-release.jks -storepass:env SIGNING_STORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" -file keystore/release-cert.der

      - name: 校验标签与版本配置一致
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '发行标签必须是 v主版本.次版本.修订号'; exit 1; }
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          ./gradlew --no-daemon -q printVersion > version-output.txt
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' version-output.txt)
          test "$RELEASE_TAG" = "v$VERSION_NAME" || { echo '发行标签与 version.properties 不一致'; exit 1; }
          echo "TAG_NAME=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          cat version-output.txt >> "$GITHUB_OUTPUT"

      - name: 执行完整质量门禁并构建发行包
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/haut-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            :core:model:test \
            :core:domain:test \
            :core:academic-protocols:test \
            :core:school-packages:test \
            :core:academic-plan:test \
            :core:selection:test \
            testDebugUnitTest \
            lintDebug \
            lintRelease \
            :app:assembleDebug \
            :app:assembleRelease \
            --stacktrace
          git diff --exit-code -- core/database/schemas
          test -z "$(git ls-files --others --exclude-standard core/database/schemas)"

      - name: 校验 APK 签名并生成发行证据
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.VERSION_NAME }}
        run: |
          mkdir -p release-assets
          REL_APK="release-assets/day-in-school-v${RELEASE_VERSION}-release.apk"
          DBG_APK="release-assets/day-in-school-v${RELEASE_VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$REL_APK"
          cp app/build/outputs/apk/debug/app-debug.apk "$DBG_APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$REL_APK" > release-assets/APK_SIGNATURE.txt
          EXPECTED_CERT=$(sha256sum keystore/release-cert.der | awk '{print tolower($1)}')
          ACTUAL_CERT=$(grep -i 'certificate SHA-256 digest:' release-assets/APK_SIGNATURE.txt | head -n 1 | awk '{print tolower($NF)}' | tr -d '\r')
          echo "EXPECTED_CERT=$EXPECTED_CERT"
          echo "ACTUAL_CERT=$ACTUAL_CERT"
          test -n "$ACTUAL_CERT" && test "$EXPECTED_CERT" = "$ACTUAL_CERT" || {
            cat release-assets/APK_SIGNATURE.txt
            echo 'APK 证书与正式签名证书不一致'
            exit 1
          }
          if grep -qi 'CN=Android Debug' release-assets/APK_SIGNATURE.txt; then
            echo '禁止发布使用调试证书签名的安装包'
            exit 1
          fi
          git rev-parse HEAD > release-assets/SOURCE_COMMIT.txt
          cp version-output.txt release-assets/VERSION.txt
          cp LICENSE THIRD_PARTY_NOTICES.md release-assets/
          tar -czf release-assets/LICENSES.tar.gz licenses
          printf 'https://github.com/%s/archive/%s.tar.gz\n' "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" > release-assets/SOURCE_ARCHIVE_URL.txt
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)

      - name: 保存测试与静态分析报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-quality-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 30

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.TAG_NAME }}
          name: "日在校园 ${{ steps.meta.outputs.TAG_NAME }}（Android 12–16）"
          generate_release_notes: true
          files: release-assets/*

      - name: 清理临时签名材料
        if: always()
        run: rm -rf keystore
