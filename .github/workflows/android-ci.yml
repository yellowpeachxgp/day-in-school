name: Android 持续集成

on:
  push:
    branches: ["main", "codex/**", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: 全模块单元测试、Lint 与 APK 构建
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 读取统一版本配置
        id: version
        run: |
          ./gradlew --no-daemon -q printVersion > version-output.txt
          grep '^VERSION_NAME=' version-output.txt >> "$GITHUB_OUTPUT"
          grep '^VERSION_CODE=' version-output.txt >> "$GITHUB_OUTPUT"

      - name: 运行全部 JVM 与 Android 单元测试
        run: ./gradlew --no-daemon \
          :core:model:test :core:domain:test \
          :core:academic-protocols:test :core:school-packages:test \
          :core:academic-plan:test :core:selection:test \
          testDebugUnitTest --stacktrace

      - name: 检查 Debug 和 Release 的 Android Lint
        run: ./gradlew --no-daemon lintDebug lintRelease --stacktrace

      - name: 构建 Debug 与未签名 Release APK
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/day-in-school-v${{ steps.version.outputs.VERSION_NAME }}-release-unsigned.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/day-in-school-v${{ steps.version.outputs.VERSION_NAME }}-debug.apk"
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          cp version-output.txt dist/VERSION.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: 检查 Room schema 已纳入版本控制
        run: |
          git diff --exit-code -- core/database/schemas
          test -z "$(git ls-files --others --exclude-standard core/database/schemas)"

      - name: 保存测试与静态分析报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 30

      - name: 保存测试安装包与源码对应信息
        uses: actions/upload-artifact@v4
        with:
          name: day-in-school-v${{ steps.version.outputs.VERSION_NAME }}-test-apks
          path: dist/*
          retention-days: 30
