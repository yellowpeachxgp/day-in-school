name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Unit Tests & APK Build (API 36 / Android 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Version Info
        id: version
        run: |
          chmod +x ./gradlew
          ./gradlew printVersion -q > version_out.txt
          cat version_out.txt >> $GITHUB_OUTPUT

      - name: Run Unit Tests
        run: ./gradlew :core:domain:test :core:academic:testDebugUnitTest --stacktrace

      - name: Decode Release Keystore (if configured)
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > keystore/haut-release.jks

      - name: Assemble Debug & Signed Release APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/day-in-school-v${{ steps.version.outputs.VERSION_NAME }}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/day-in-school-v${{ steps.version.outputs.VERSION_NAME }}-debug.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: day-in-school-v${{ steps.version.outputs.VERSION_NAME }}-apks
          path: dist/*
          retention-days: 30
