name: HAUT Campus Assistant Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Check no committed credentials or session files
        run: |
          ! git ls-files | grep -E '\.(jks|keystore|cookies|session)$|secrets\.properties|credentials\.json'

      - name: Run Pure Domain & Academic Unit Tests
        run: ./gradlew test --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haut-campus-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
