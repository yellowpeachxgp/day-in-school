name: Android 持续集成

on:
  push:
    branches: ["main", "codex/**", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: 全模块单元测试、Lint 与 APK 构建
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 读取统一版本配置
        id: version
        run: |
          ./gradlew --no-daemon -q printVersion > version-output.txt
          grep '^VERSION_NAME=' version-output.txt >> "$GITHUB_OUTPUT"
          grep '^VERSION_CODE=' version-output.txt >> "$GITHUB_OUTPUT"

      - name: 运行全部 JVM 与 Android 单元测试
        run: |
          ./gradlew --no-daemon \
            :core:model:test :core:domain:test \
            :core:academic-protocols:test :core:school-packages:test \
            :core:academic-plan:test :core:selection:test \
            testDebugUnitTest --stacktrace

      - name: 验证 Roborazzi 截图基线
        run: ./gradlew --no-daemon verifyRoborazziDebug --stacktrace

      - name: 检查 Debug 和 Release 的 Android Lint
        run: ./gradlew --no-daemon lintDebug lintRelease --stacktrace

      - name: 构建 Debug 与未签名 Release APK
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/day-in-school-v${{ steps.version.outputs.VERSION_NAME }}-release-unsigned.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/day-in-school-v${{ steps.version.outputs.VERSION_NAME }}-debug.apk"
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          cp version-output.txt dist/VERSION.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: 检查 Room schema 已纳入版本控制
        run: |
          git diff --exit-code -- core/database/schemas
          test -z "$(git ls-files --others --exclude-standard core/database/schemas)"

      - name: 保存测试与静态分析报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-quality-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*
            **/build/reports/roborazzi/**
            **/build/test-results/roborazzi/**
            **/build/outputs/roborazzi-compare/**
          if-no-files-found: warn
          retention-days: 30

      - name: 保存测试安装包与源码对应信息
        uses: actions/upload-artifact@v7
        with:
          name: day-in-school-v${{ steps.version.outputs.VERSION_NAME }}-test-apks
          path: dist/*
          retention-days: 30

  architecture-guardrails:
    name: 架构护栏（依赖方向与文件行数）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # 文件行数门禁的基线棘轮需要与 main 计算 merge-base，必须全量拉取历史；
      # 浅克隆下门禁按 fail-closed 设计直接失败，不会静默放行。
      - name: 检出源码（全量历史）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 依赖方向与 ui/ 包 import 检查
        run: tools/dep-check/run

      - name: 文件行数门禁
        run: tools/file-line-gate/run

  cloud-quote-contract:
    name: 核对 Cloud 实际 handler 报价与错误契约
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出 Day 源码
        uses: actions/checkout@v7
      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 读取固定的 Cloud 契约源提交
        id: cloud-source
        run: node -e 'const s=require("./tools/contract-ci/cloud-fixture-source.json"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "sha="+s.commit+"\n")'
      - name: 检出固定 Cloud 源码
        uses: actions/checkout@v7
        with:
          repository: yellowpeachxgp/cloud-in-school
          ref: ${{ steps.cloud-source.outputs.sha }}
          path: .contract-cloud
      - name: 检出云端 main 权威契约
        uses: actions/checkout@v7
        with:
          repository: yellowpeachxgp/cloud-in-school
          ref: main
          path: .contract-cloud-main
          persist-credentials: false
      - name: 比对云端 main 与 Android 契约哈希
        run: node tools/contract-ci/sync-contracts.mjs check --cloud-root .contract-cloud-main --android-root .
      - name: 验证 Day 及跨端实际响应契约
        run: |
          node tools/contract-ci/validate-contracts.mjs
          node tools/contract-ci/check-cloud-fixtures.mjs .contract-cloud
